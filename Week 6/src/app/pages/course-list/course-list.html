<hr>

<label>Search Course:</label>

<br><br>

<input
  type="text"
  [(ngModel)]="searchTerm"
  (input)="updateSearch()"
  placeholder="Enter course name">

<p>Search: {{ searchTerm }}</p>

<hr>

<h2>Course List</h2>

<ul>
  <li *ngFor="let course of (courses$ | async)">

    <span
      (click)="viewCourse(course.id)"
      style="cursor: pointer; color: blue; text-decoration: underline;">

      {{ course.name }}
      ({{ course.code }})
      - Credits: {{ course.credits }}

    </span>

    <button (click)="toggleEnrollment(course.id)">
      {{ enrollmentService.isEnrolled(course.id)
          ? 'Unenroll'
          : 'Enroll' }}
    </button>

  </li>
</ul>

<div *ngIf="loading">
  <p>Loading courses...</p>
</div>

<div *ngIf="errorMessage">

  <p style="color:red">
    {{ errorMessage }}
  </p>

</div>

<div *ngIf="!loading">
  <h2>Courses from API</h2>

  <ul>
    <li *ngFor="let course of apiCourses">
      {{ course.id }} - {{ course.title }}
    </li>
  </ul>
</div>

<hr>

<h2>Courses from API</h2>

<ul>
  <li *ngFor="let course of apiCourses">
    {{ course.id }} - {{ course.title }}
    <button (click)="addCourseToApi()">
      Add Course to API
    </button>
    <button (click)="updateCourseInApi()">
      Update Course
    </button>
    <button (click)="deleteCourseFromApi()">
      Delete Course
    </button>
  </li>

</ul>
